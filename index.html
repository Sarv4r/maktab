<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>IlmNuri — Akademik Raqamli Ekotizim</title>
  <meta name="description" content="IlmNuri — o‘quvchilar, ustozlar va maktab ma’muriyati uchun yagona raqamli ta’lim platformasi. Vazifalar, testlar, chatlar va akademik tahlillar bir joyda.">
  <meta property="og:title" content="IlmNuri — Raqamli ta’lim platformasi">
  <meta property="og:description" content="Maktab hayotini boshqarish, o‘rganish va natijalarni kuzatish uchun yagona platforma.">
  <meta property="og:type" content="website">
  <meta name="color-scheme" content="light dark">
  

<!-- IlmNuri Premium Frontend Refresh | visual-only layer -->


  <link rel="icon" type="image/png" sizes="48x48" href="./assets/icon-48.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./assets/icon-192.png">
  <meta name="theme-color" content="#365fe3">
  <link rel="stylesheet" href="./assets/css/styles.css">
  <link rel="stylesheet" href="./assets/css/experience.css">
</head>
<body>

<div id="toastStack"></div>

<!-- ================= AUTH SCREEN ================= -->
<div id="authScreen" class="auth-wrap">
  <div class="auth-card">
    <div class="brand-logo"><img class="brand-crest" src="./assets/icon-192.png" alt=""> IlmNuri</div>
    <p style="font-size:13px;color:var(--muted);">O'quvchilar, ustozlar va maktab boshqaruvi uchun akademik raqamli ekotizim</p>

    <div class="tabs">
      <button id="tabLoginBtn" class="tab-btn active" onclick="switchAuthTab('login')">Kirish</button>
      <button id="tabRegBtn" class="tab-btn" onclick="switchAuthTab('register')">Ro'yxatdan o'tish</button>
    </div>

    <!-- LOGIN FORM -->
    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="loginUser">Login</label>
        <input type="text" id="loginUser" autocomplete="username" placeholder="Loginingizni kiriting" required />
      </div>
      <div class="form-group">
        <label for="loginPass">Parol</label>
        <input type="password" id="loginPass" autocomplete="current-password" placeholder="Parolingizni kiriting" required />
      </div>
      <button type="submit" id="loginSubmitBtn" class="btn-primary">Kabinetga Kirish</button>
    </form>

    <!-- REGISTER FORM -->
    <form id="registerForm" class="hidden" onsubmit="handleRegister(event)">
      <div class="form-group">
        <label for="regName">Ism va Familiya</label>
        <input type="text" id="regName" placeholder="Masalan: Anvar Karimov" required />
      </div>
      <div class="form-group">
        <label for="regRole">Maqomingiz</label>
        <select id="regRole" onchange="toggleRegFields()">
          <option value="student">O'quvchi</option>
          <option value="teacher">Fan O'qituvchisi</option>
          <option value="homeroom">Sinf Rahbari</option>
        </select>
      </div>
      <div id="regClassWrap" class="form-group">
        <label for="regClass">Sinfingiz</label>
        <select id="regClass">
          <option value="5-sinf">5-sinf</option>
          <option value="6-sinf">6-sinf</option>
          <option value="7-sinf">7-sinf</option>
          <option value="8-sinf">8-sinf</option>
          <option value="9-sinf" selected>9-sinf</option>
          <option value="10-sinf">10-sinf</option>
          <option value="11-sinf">11-sinf</option>
        </select>
      </div>
      <div id="regSubjectWrap" class="form-group hidden">
        <label for="regSubject">Dars beradigan faningiz</label>
        <select id="regSubject"></select>
      </div>
      <div class="form-group">
        <label for="regLogin">Login o'ylab toping</label>
        <input type="text" id="regLogin" placeholder="Masalan: anvar09" required />
      </div>
      <div class="form-group">
        <label for="regPass">Parol o'ylab toping</label>
        <input type="password" id="regPass" autocomplete="new-password" placeholder="Kamida 4 ta belgi" required />
      </div>
      <button type="submit" id="regSubmitBtn" class="btn-primary">IlmNuriga qo‘shilish</button>
    </form>
  </div>
</div>

<!-- ================= APP SCREEN ================= -->
<div id="appScreen" class="app-shell hidden">
  <div id="sidebarOverlay" class="sidebar-overlay" onclick="toggleMobileSidebar()"></div>

  <aside id="sidebar" class="sidebar">
    <div>
      <div class="brand-logo" style="padding:4px 8px;"><img class="brand-crest" src="./assets/icon-192.png" alt=""> IlmNuri</div>
      <nav id="navMenu" class="nav-menu"></nav>
    </div>
  </aside>

  <div class="main-wrap">
    <header class="topbar">
      <div style="display:flex;align-items:center;gap:12px;">
        <button class="menu-toggle" onclick="toggleMobileSidebar()">☰</button>
        <div>
          <div id="topUserName" style="font-weight:700;font-size:15px;color:var(--text);"></div>
          <div id="topUserSub" style="font-size:11.5px;color:var(--muted);"></div>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:12px;">
        <span id="topRoleBadge" class="badge badge-blue"></span>
        <div id="topAvatarHolder"></div>
      </div>
    </header>

    <aside id="phonePrompt" hidden aria-label="E’lon bildirishnomalari">
      <strong>Yangi e’lonlar telefonga kelsinmi?</strong>
      <button type="button" class="btn-secondary" onclick="enablePhoneAlerts(false)">Xabarlarni yoqish</button>
      <button type="button" class="member-name" onclick="postponePhonePrompt()">Keyinroq</button>
    </aside>
    <main id="mainContent" class="content-area"></main>
  </div>

  <nav id="mobileBottomNav" class="bottom-nav"></nav>
</div>

<!-- MODAL -->
<div id="modalBackdrop" class="modal-backdrop hidden" onclick="closeModalOnBg(event)">
  <div id="modalCard" class="modal-card"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="./assets/app.js"></script>
<script src="./assets/experience.js"></script>
<script src="./assets/phone.js"></script>
</body>
</html>

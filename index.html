<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MaktabOS — Akademik Raqamli Ekotizim</title>
  <style>
    :root {
      --bg: #F4F7FB;
      --surface: #FFFFFF;
      --primary: #2563EB;
      --primary-hover: #1D4ED8;
      --primary-soft: #EFF6FF;
      --navy-soft: #2563EB;
      --accent: #E11D48;
      --gold: #D97706;
      --gold-bright: #F59E0B;
      --text: #1E293B;
      --muted: #64748B;
      --border: #E2E8F0;
      --border-soft: #F1F5F9;
      --shadow-xs: 0 1px 2px rgba(37, 99, 235, 0.04);
      --shadow: 0 6px 24px -4px rgba(148, 163, 184, 0.14), 0 2px 6px -1px rgba(148, 163, 184, 0.06);
      --shadow-lg: 0 20px 40px -12px rgba(100, 116, 139, 0.18);
      --radius: 16px;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .hidden { display: none !important; }

    /* Custom Light Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #94A3B8; }

    /* Buttons & Inputs */
    button {
      cursor: pointer;
      border: none;
      border-radius: 11px;
      font-weight: 600;
      font-size: 13px;
      transition: all 0.22s var(--ease);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      letter-spacing: -0.005em;
    }
    button:active { transform: scale(0.97); }
    button:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }

    .btn-primary {
      background: linear-gradient(135deg, #3B82F6, #2563EB);
      color: #fff;
      padding: 11px 18px;
      width: 100%;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.18);
    }
    .btn-primary:hover { background: linear-gradient(135deg, #2563EB, #1D4ED8); transform: translateY(-1px); }

    .btn-secondary {
      background: #F8FAFC;
      color: var(--text);
      padding: 9px 14px;
      border: 1px solid var(--border);
    }
    .btn-secondary:hover { background: #EFF6FF; border-color: #BFDBFE; color: var(--primary); }

    .btn-gold {
      background: linear-gradient(135deg, #F59E0B, #D97706);
      color: #fff;
      padding: 10px 15px;
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.22);
    }
    .btn-gold:hover { filter: brightness(1.04); transform: translateY(-1px); }

    .btn-accent {
      background: #FFF1F2;
      color: #E11D48;
      padding: 9px 12px;
      border: 1px solid #FECDD3;
    }
    .btn-accent:hover { background: #FFE4E6; }

    input, select, textarea {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid var(--border);
      border-radius: 11px;
      font-size: 14px;
      background: #FFFFFF;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s var(--ease), box-shadow 0.2s var(--ease);
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    /* Toast Notifications */
    #toastStack {
      position: fixed;
      top: 18px;
      right: 18px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-width: 340px;
      pointer-events: none;
    }
    .toast {
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(10px);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      box-shadow: var(--shadow-lg);
      animation: slideIn 0.28s var(--ease);
    }
    .toast.success { background: #ECFDF5; color: #065F46; border-color: #A7F3D0; }
    .toast.error { background: #FFF1F2; color: #9F1239; border-color: #FECDD3; }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-8px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Auth Screen */
    .auth-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: radial-gradient(circle at top left, #E0F2FE 0%, #F4F7FB 50%, #EEF2FF 100%);
    }
    .auth-card {
      background: var(--surface);
      width: 100%;
      max-width: 420px;
      padding: 36px 32px;
      border-radius: 24px;
      box-shadow: var(--shadow-lg);
      border: 1px solid #E2E8F0;
    }
    .brand-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 20px;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 6px;
      letter-spacing: -0.025em;
    }
    .brand-crest {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      background: linear-gradient(135deg, #3B82F6, #2563EB);
      color: #FFFFFF;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 800;
      box-shadow: 0 3px 10px rgba(37, 99, 235, 0.25);
    }
    .tabs {
      display: flex;
      background: #F1F5F9;
      padding: 4px;
      border-radius: 12px;
      margin: 22px 0;
    }
    .tab-btn {
      flex: 1;
      padding: 8px 12px;
      background: transparent;
      color: var(--muted);
      border-radius: 9px;
      font-weight: 600;
    }
    .tab-btn.active {
      background: #fff;
      color: var(--primary);
      box-shadow: 0 1px 4px rgba(100, 116, 139, 0.12);
    }
    .form-group { margin-bottom: 15px; }
    .form-group label {
      display: block;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 6px;
      letter-spacing: 0.01em;
    }

    /* App Layout - Light Airy Sidebar */
    .app-shell { display: flex; min-height: 100vh; }
    .sidebar {
      width: 256px;
      background: #FFFFFF;
      color: var(--text);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 22px 14px;
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      z-index: 100;
      transition: transform 0.28s var(--ease);
    }
    .nav-menu { display: flex; flex-direction: column; gap: 4px; margin-top: 22px; overflow-y: auto; }
    .nav-item {
      width: 100%;
      justify-content: space-between;
      padding: 10px 12px;
      background: transparent;
      color: var(--muted);
      border-radius: 11px;
      font-size: 13.5px;
      font-weight: 500;
    }
    .nav-item:hover { background: #F8FAFC; color: var(--primary); }
    .nav-item.active {
      background: #EFF6FF;
      color: var(--primary);
      font-weight: 700;
    }
    .nav-item-left { display: flex; align-items: center; gap: 11px; }
    .nav-pill {
      background: #DBEAFE;
      color: #1D4ED8;
      font-size: 11px;
      padding: 1px 8px;
      border-radius: 20px;
      font-weight: 700;
    }

    .main-wrap {
      flex: 1;
      margin-left: 256px;
      display: flex;
      flex-direction: column;
      min-width: 0;
      padding-bottom: 76px;
    }
    .topbar {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 13px 26px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .menu-toggle {
      display: none;
      background: #F8FAFC;
      color: var(--text);
      padding: 8px 11px;
      border: 1px solid var(--border);
    }
    .content-area {
      padding: 26px;
      max-width: 1120px;
      width: 100%;
      margin: 0 auto;
      animation: fadeSoft 0.25s var(--ease);
    }
    @keyframes fadeSoft {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Cards & Grids */
    .page-title {
      font-size: 21px;
      font-weight: 800;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 9px;
      letter-spacing: -0.025em;
    }
    .page-sub { font-size: 13.5px; color: var(--muted); margin: 3px 0 22px; }
    .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; margin-bottom: 18px; }
    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 16px; margin-bottom: 18px; }
    .card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 20px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      transition: box-shadow 0.22s var(--ease), border-color 0.22s var(--ease);
    }
    .stat-label {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
      letter-spacing: 0.01em;
    }
    .stat-val {
      font-size: 26px;
      font-weight: 800;
      color: var(--text);
      margin-top: 6px;
      letter-spacing: -0.03em;
    }

    /* Badges */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      background: #F1F5F9;
      color: #475569;
    }
    .badge-gold { background: #FEF3C7; color: #B45309; }
    .badge-green { background: #DCFCE7; color: #15803D; }
    .badge-blue { background: #DBEAFE; color: #1D4ED8; }
    .badge-red { background: #FFE4E6; color: #BE123C; }

    /* Avatars & GIF Frame Overlays */
    .avatar-wrap {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .avatar-circle {
      border-radius: 50%;
      background: linear-gradient(135deg, #DBEAFE, #EFF6FF);
      color: #1D4ED8;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
      position: relative;
      z-index: 1;
      border: 2px solid #FFFFFF;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.14);
    }
    .avatar-circle img { width: 100%; height: 100%; object-fit: cover; }
    .avatar-gif-overlay {
      position: absolute;
      inset: -22%;
      width: 144%;
      height: 144%;
      z-index: 2;
      pointer-events: none;
      object-fit: contain;
    }

    /* Chats */
    .chat-layout {
      display: grid;
      grid-template-columns: 270px 1fr;
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      overflow: hidden;
      min-height: 540px;
      box-shadow: var(--shadow);
    }
    .chat-sidebar { border-right: 1px solid var(--border); background: #F8FAFC; }
    .chat-list { max-height: 470px; overflow-y: auto; }
    .chat-room-item {
      padding: 13px 15px;
      border-bottom: 1px solid var(--border-soft);
      cursor: pointer;
      transition: background 0.18s var(--ease);
    }
    .chat-room-item:hover { background: #F1F5F9; }
    .chat-room-item.active { background: #EFF6FF; border-left: 3px solid var(--primary); }
    .chat-main { display: flex; flex-direction: column; }
    .chat-header {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      background: #FFFFFF;
    }
    .chat-messages {
      flex: 1;
      padding: 18px;
      overflow-y: auto;
      max-height: 375px;
      display: flex;
      flex-direction: column;
      gap: 11px;
      background: #F8FAFC;
    }
    .msg-bubble {
      max-width: 78%;
      background: #FFFFFF;
      padding: 11px 14px;
      border-radius: 14px 14px 14px 4px;
      align-self: flex-start;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-xs);
    }
    .msg-bubble.mine {
      background: #EFF6FF;
      border-color: #DBEAFE;
      align-self: flex-end;
      border-radius: 14px 14px 4px 14px;
    }
    .msg-meta {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: 11px;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 4px;
    }
    .msg-actions { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 8px; }
    .react-btn {
      background: #F8FAFC;
      color: var(--muted);
      padding: 3px 9px;
      font-size: 11px;
      font-weight: 600;
      border-radius: 20px;
      border: 1px solid var(--border);
    }
    .react-btn:hover { background: #EFF6FF; color: var(--primary); }
    .react-btn.reacted {
      background: #FEF3C7;
      color: #B45309;
      border-color: #FCD34D;
    }
    .chat-input-bar {
      padding: 12px 14px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      align-items: center;
      background: #fff;
    }

    /* Modals */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(148, 163, 184, 0.35);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      z-index: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      animation: fadeSoft 0.2s var(--ease);
    }
    .modal-card {
      background: #fff;
      border-radius: 20px;
      padding: 24px;
      width: 100%;
      max-width: 500px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border);
    }

    /* Certificate Print Styling */
    .cert-frame-outer { border: 6px double #D97706; padding: 10px; background: #FFFBEB; border-radius: 12px; text-align: center; }
    .cert-frame-inner { border: 1.5px solid #2563EB; padding: 24px 18px; border-radius: 8px; background: #FFFFFF; }
    .cert-ribbon { display: inline-block; background: #EFF6FF; color: #1D4ED8; border: 1px solid #BFDBFE; padding: 4px 14px; border-radius: 20px; font-size: 11px; font-weight: 700; margin-bottom: 8px; letter-spacing: 0.05em; }
    .cert-main-title { font-size: 26px; font-weight: 800; color: #D97706; letter-spacing: 3px; margin: 4px 0; }
    .cert-recipient { font-size: 21px; font-weight: 800; color: #1E293B; border-bottom: 2px solid #F59E0B; display: inline-block; padding: 4px 22px; margin: 10px 0 4px; }
    .cert-gold-seal { width: 66px; height: 66px; border-radius: 50%; background: radial-gradient(circle, #FEF08A, #F59E0B); color: #78350F; font-size: 9px; font-weight: 800; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 2px dashed #92400E; }

    /* Mobile Bottom Navigation - Light Theme */
    .bottom-nav {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(10px);
      border-top: 1px solid var(--border);
      z-index: 90;
      padding: 7px 4px;
      justify-content: space-around;
    }
    .bnav-btn { background: transparent; color: var(--muted); flex-direction: column; font-size: 10px; padding: 4px 8px; gap: 3px; position: relative; }
    .bnav-btn.active { color: var(--primary); font-weight: 700; }
    .bnav-bar { height: 2.5px; width: 16px; border-radius: 3px; background: transparent; }
    .bnav-btn.active .bnav-bar { background: var(--primary); }
    .sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(148, 163, 184, 0.35); z-index: 95; }
    .sidebar-overlay.show { display: block; }

    @media (max-width: 820px) {
      .sidebar { transform: translateX(-100%); }
      .sidebar.open { transform: translateX(0); }
      .main-wrap { margin-left: 0; }
      .menu-toggle { display: inline-flex; }
      .bottom-nav { display: flex; }
      .chat-layout { grid-template-columns: 1fr; }
      .chat-sidebar { max-height: 170px; border-right: none; border-bottom: 1px solid var(--border); }
    }

    @media print {
      body * { visibility: hidden; }
      #certPrintArea, #certPrintArea * { visibility: visible; }
      #certPrintArea { position: fixed; left: 0; top: 0; width: 100%; }
    }
  </style>
</head>
<body>

<div id="toastStack"></div>

<!-- ================= AUTH SCREEN ================= -->
<div id="authScreen" class="auth-wrap">
  <div class="auth-card">
    <div class="brand-logo"><span class="brand-crest">M</span> MaktabOS</div>
    <p style="font-size:13px;color:var(--muted);">O'quvchilar, ustozlar va maktab boshqaruvi uchun akademik raqamli ekotizim</p>

    <div class="tabs">
      <button id="tabLoginBtn" class="tab-btn active" onclick="switchAuthTab('login')">Kirish</button>
      <button id="tabRegBtn" class="tab-btn" onclick="switchAuthTab('register')">Ro'yxatdan o'tish</button>
    </div>

    <!-- LOGIN FORM -->
    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label>Login</label>
        <input type="text" id="loginUser" placeholder="Loginingizni kiriting" required />
      </div>
      <div class="form-group">
        <label>Parol</label>
        <input type="password" id="loginPass" placeholder="Parolingizni kiriting" required />
      </div>
      <button type="submit" id="loginSubmitBtn" class="btn-primary">Kabinetga Kirish</button>
    </form>

    <!-- REGISTER FORM -->
    <form id="registerForm" class="hidden" onsubmit="handleRegister(event)">
      <div class="form-group">
        <label>Ism va Familiya</label>
        <input type="text" id="regName" placeholder="Masalan: Anvar Karimov" required />
      </div>
      <div class="form-group">
        <label>Maqomingiz</label>
        <select id="regRole" onchange="toggleRegFields()">
          <option value="student">O'quvchi</option>
          <option value="teacher">Fan O'qituvchisi</option>
          <option value="homeroom">Sinf Rahbari</option>
        </select>
      </div>
      <div id="regClassWrap" class="form-group">
        <label>Sinfingiz</label>
        <select id="regClass">
          <option value="5-sinf">5-sinf</option>
          <option value="6-sinf">6-sinf</option>
          <option value="7-sinf">7-sinf</option>
          <option value="8-sinf">8-sinf</option>
          <option value="9-sinf" selected>9-sinf</option>
          <option value="10-sinf">10-sinf</option>
          <option value="11-sinf">11-sinf</option>
        </select>
      </div>
      <div id="regSubjectWrap" class="form-group hidden">
        <label>Dars beradigan faningiz</label>
        <select id="regSubject"></select>
      </div>
      <div class="form-group">
        <label>Login o'ylab toping</label>
        <input type="text" id="regLogin" placeholder="Masalan: anvar09" required />
      </div>
      <div class="form-group">
        <label>Parol o'ylab toping</label>
        <input type="password" id="regPass" placeholder="Kamida 4 ta belgi" required />
      </div>
      <button type="submit" id="regSubmitBtn" class="btn-primary">MaktabOS ga Qo'shilish</button>
    </form>
  </div>
</div>

<!-- ================= APP SCREEN ================= -->
<div id="appScreen" class="app-shell hidden">
  <div id="sidebarOverlay" class="sidebar-overlay" onclick="toggleMobileSidebar()"></div>

  <aside id="sidebar" class="sidebar">
    <div>
      <div class="brand-logo" style="padding:4px 8px;"><span class="brand-crest">M</span> MaktabOS</div>
      <nav id="navMenu" class="nav-menu"></nav>
    </div>
    <button class="btn-accent" style="width:100%;" onclick="logout()">Tizimdan Chiqish</button>
  </aside>

  <div class="main-wrap">
    <header class="topbar">
      <div style="display:flex;align-items:center;gap:12px;">
        <button class="menu-toggle" onclick="toggleMobileSidebar()">☰</button>
        <div>
          <div id="topUserName" style="font-weight:700;font-size:15px;color:var(--text);"></div>
          <div id="topUserSub" style="font-size:11.5px;color:var(--muted);"></div>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:12px;">
        <span id="topRoleBadge" class="badge badge-blue"></span>
        <div id="topAvatarHolder"></div>
      </div>
    </header>

    <main id="mainContent" class="content-area"></main>
  </div>

  <nav id="mobileBottomNav" class="bottom-nav"></nav>
</div>

<!-- MODAL -->
<div id="modalBackdrop" class="modal-backdrop hidden" onclick="closeModalOnBg(event)">
  <div id="modalCard" class="modal-card"></div>
</div>

<script>
const CLOUD_DB_URL = "https://maktabos-7172b-default-rtdb.firebaseio.com/maktabos_db.json";
const SESSION_KEY = "maktabos_active_uid_v1";

/* ================= ANIMATED GIF FRAME GENERATOR (REAL TRANSPARENT GIF89a) ================= */
const GIF_FRAME_CACHE = {};

function encodeAnimatedGif89a(width, height, framesIndices, paletteRGB, delayCs = 7) {
  const bytes = [];
  const pushStr = s => { for (let i = 0; i < s.length; i++) bytes.push(s.charCodeAt(i)); };
  const push16 = v => { bytes.push(v & 0xFF, (v >> 8) & 0xFF); };

  pushStr("GIF89a");
  push16(width);
  push16(height);
  bytes.push(0xF7, 0, 0); // Global Color Table (256 colors), transparent idx 0

  for (let i = 0; i < 256; i++) {
    const c = paletteRGB[i] || [0, 0, 0];
    bytes.push(c[0], c[1], c[2]);
  }

  // NETSCAPE2.0 Infinite Loop
  bytes.push(0x21, 0xFF, 0x0B);
  pushStr("NETSCAPE2.0");
  bytes.push(0x03, 0x01, 0x00, 0x00, 0x00);

  framesIndices.forEach(idxArr => {
    // Graphic Control Extension: disposal = 2 (restore transparent bg), transparent = true (idx 0)
    bytes.push(0x21, 0xF9, 0x04, 0x09);
    push16(delayCs);
    bytes.push(0x00, 0x00);

    // Image Descriptor
    bytes.push(0x2C);
    push16(0); push16(0); push16(width); push16(height);
    bytes.push(0x00);

    // LZW Compression (minCodeSize = 8)
    bytes.push(8);
    const sub = [];
    let bitBuf = 0, bitCnt = 0;
    const emit = (code, size) => {
      bitBuf |= (code << bitCnt);
      bitCnt += size;
      while (bitCnt >= 8) {
        sub.push(bitBuf & 0xFF);
        bitBuf >>= 8;
        bitCnt -= 8;
      }
    };

    const clearCode = 256, endCode = 257;
    let codeSize = 9, nextCode = 258;
    let dict = new Map();
    emit(clearCode, codeSize);

    let prefix = idxArr[0];
    for (let i = 1; i < idxArr.length; i++) {
      const k = idxArr[i];
      const key = (prefix << 8) | k;
      const found = dict.get(key);
      if (found !== undefined) {
        prefix = found;
      } else {
        emit(prefix, codeSize);
        dict.set(key, nextCode++);
        if (nextCode > (1 << codeSize)) {
          if (codeSize < 12) {
            codeSize++;
          } else {
            emit(clearCode, codeSize);
            dict.clear();
            codeSize = 9;
            nextCode = 258;
          }
        }
        prefix = k;
      }
    }
    emit(prefix, codeSize);
    emit(endCode, codeSize);
    if (bitCnt > 0) sub.push(bitBuf & 0xFF);

    for (let i = 0; i < sub.length; i += 255) {
      const chunk = sub.slice(i, i + 255);
      bytes.push(chunk.length, ...chunk);
    }
    bytes.push(0x00);
  });

  bytes.push(0x3B);
  let bin = "";
  for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return "data:image/gif;base64," + btoa(bin);
}

function getGifFrameDataUrl(key) {
  if (GIF_FRAME_CACHE[key]) return GIF_FRAME_CACHE[key];
  const size = 80;
  const cx = size / 2, cy = size / 2;
  const rInner = 27.5; // Shaffof markaz (avatar yopilmaydi)
  const rOuter = 38.5;

  const palettes = {
    gif_crown: [[0,0,0], [254,240,138], [250,204,21], [245,158,11], [217,119,6], [255,255,255]],
    gif_lightning: [[0,0,0], [186,230,253], [56,189,248], [37,99,235], [99,102,241], [255,255,255]],
    gif_fire: [[0,0,0], [254,240,138], [251,146,60], [239,68,68], [225,29,72], [255,255,255]],
    gif_emerald: [[0,0,0], [167,243,208], [52,211,153], [16,185,129], [5,150,105], [255,255,255]],
    gif_galaxy: [[0,0,0], [233,213,255], [192,132,252], [236,72,153], [59,130,246], [255,255,255]],
    gif_diamond: [[0,0,0], [255,255,255], [125,211,252], [253,224,71], [244,114,182], [167,139,250]]
  };

  const pal = palettes[key] || palettes.gif_crown;
  const totalFrames = 12;
  const frames = [];

  for (let f = 0; f < totalFrames; f++) {
    const phase = (f / totalFrames) * Math.PI * 2;
    const grid = new Uint8Array(size * size);

    for (let y = 0; y < size; y++) {
      for (let x = 0; x < size; x++) {
        const dx = x - cx + 0.5;
        const dy = y - cy + 0.5;
        const dist = Math.hypot(dx, dy);
        if (dist < rInner || dist > rOuter) continue;

        const ang = Math.atan2(dy, dx);
        let colorIdx = 0;

        if (key === "gif_crown") {
          // Aylanuvchi oltin uzuk + yuqorida toj uchlari + uchqunlar
          const wave = Math.sin(ang * 6 - phase);
          const crownTop = (ang > -2.35 && ang < -0.78) ? Math.abs(Math.sin((ang + 1.57) * 5)) * 4.5 : 0;
          if (dist >= rInner && dist <= rInner + 3.2 + crownTop) {
            colorIdx = wave > 0.4 ? 1 : wave > -0.2 ? 2 : 3;
          }
          const sparkAngle = (ang - phase) * 4;
          if (Math.sin(sparkAngle) > 0.88 && Math.abs(dist - (rInner + 5.8 + Math.sin(phase + ang * 3) * 1.6)) < 1.5) {
            colorIdx = 5;
          }
        } else if (key === "gif_lightning") {
          // Chaqmoq razryadlari va energiya halqasi
          const zig = Math.sin(ang * 9 + phase * 2) * 2.2 + Math.cos(ang * 5 - phase) * 1.4;
          const ringCenter = rInner + 4.2 + zig;
          const dRing = Math.abs(dist - ringCenter);
          if (dRing < 1.3) colorIdx = 5;
          else if (dRing < 2.6) colorIdx = 2;
          else if (dRing < 3.8 && Math.sin(ang * 7 - phase) > 0.2) colorIdx = 3;
        } else if (key === "gif_fire") {
          // Olov tillari halqasi
          const flame = Math.sin(ang * 8 + phase) * 2.5 + Math.cos(ang * 13 - phase * 2) * 1.8;
          const maxFlame = rInner + 5.5 + flame;
          if (dist <= maxFlame) {
            const ratio = (dist - rInner) / Math.max(1, maxFlame - rInner);
            colorIdx = ratio < 0.35 ? 1 : ratio < 0.65 ? 2 : ratio < 0.88 ? 3 : 4;
          }
        } else if (key === "gif_emerald") {
          // Zumrad plazma to'lqini
          const pulse = Math.sin(ang * 4 - phase * 2) * 2.0;
          if (dist <= rInner + 4.5 + pulse) {
            colorIdx = Math.sin(ang * 8 + phase) > 0.3 ? 1 : 3;
          }
          if (Math.abs(dist - (rInner + 7.2)) < 1.2 && Math.cos(ang * 6 - phase) > 0.7) {
            colorIdx = 5;
          }
        } else if (key === "gif_galaxy") {
          // Binafsha-pushti galaktika spirali
          const spiral = Math.sin(ang * 3 - phase + (dist - rInner) * 0.45);
          if (dist <= rInner + 5.2 && spiral > -0.3) {
            colorIdx = spiral > 0.55 ? 1 : spiral > 0.15 ? 3 : 2;
          }
          if (Math.sin(ang * 7 + phase) > 0.85 && Math.abs(dist - (rInner + 6.8)) < 1.5) {
            colorIdx = 5;
          }
        } else {
          // Imperator olmos qirralari va yulduzli jilo
          const facets = Math.abs(Math.sin(ang * 8 + phase));
          const outerEdge = rInner + 3.8 + facets * 4.2;
          if (dist <= outerEdge) {
            const band = Math.floor(((ang + Math.PI + phase) / (Math.PI * 2)) * 4) % 4;
            colorIdx = facets > 0.75 ? 1 : band + 2;
          }
        }

        grid[y * size + x] = colorIdx;
      }
    }
    frames.push(grid);
  }

  const url = encodeAnimatedGif89a(size, size, frames, pal, 7);
  GIF_FRAME_CACHE[key] = url;
  return url;
}

function notify(msg, type = "info") {
  const stack = document.getElementById("toastStack");
  if (!stack) return;
  const el = document.createElement("div");
  el.className = "toast" + (type === "success" ? " success" : type === "error" ? " error" : "");
  el.textContent = msg;
  stack.appendChild(el);
  setTimeout(() => {
    el.style.opacity = "0";
    el.style.transform = "translateY(-8px)";
    el.style.transition = "all 0.22s ease";
    setTimeout(() => el.remove(), 240);
  }, 3000);
}

          picked.push({

          authorName: null,

          questions: picked

      }
    });
  });
  return bank;

function calculateSpentPoints(user) {
  if (typeof user.spentPoints === "number" && user.spentPoints > 0) return user.spentPoints;
  let sum = 0;
  (user.owned || []).forEach(id => {
    const it = STORE_CATALOG.find(x => x.id === id);
    if (it) sum += it.price;
  });
  return sum;
}

function getTotalEarnedPoints(user) {
  return (user.points || 0) + calculateSpentPoints(user);
}

function normalizeDB(data) {
  if (!data || typeof data !== "object") return JSON.parse(JSON.stringify(DEFAULT_DB));
  if (!Array.isArray(data.users) || data.users.length === 0) data.users = JSON.parse(JSON.stringify(DEFAULT_DB.users));
  if (!data.users.some(u => u.id === "u_admin")) data.users.unshift(JSON.parse(JSON.stringify(DEFAULT_DB.users[0])));
  if (!Array.isArray(data.rooms) || data.rooms.length === 0) data.rooms = JSON.parse(JSON.stringify(DEFAULT_DB.rooms));
  if (!data.messages || typeof data.messages !== "object") data.messages = JSON.parse(JSON.stringify(DEFAULT_DB.messages));
  if (!data.messages["r_general"]) data.messages["r_general"] = [];
  if (!Array.isArray(data.tasks)) data.tasks = [];
  if (!Array.isArray(data.announcements)) data.announcements = JSON.parse(JSON.stringify(DEFAULT_DB.announcements));
  if (!Array.isArray(data.certificates)) data.certificates = [];
  if (!Array.isArray(data.customTests)) data.customTests = [];

  data.users.forEach(u => {
    if (!Array.isArray(u.owned)) u.owned = [];
    if (!Array.isArray(u.solvedTests)) u.solvedTests = [];
    if (!Array.isArray(u.claimedMissions)) u.claimedMissions = [];
    if (typeof u.points !== "number") u.points = 0;
    if (typeof u.weeklyPoints !== "number") u.weeklyPoints = 0;
    if (typeof u.spentPoints !== "number") u.spentPoints = calculateSpentPoints(u);
    if (u.activeFrame && !u.activeFrame.startsWith("gif_")) u.activeFrame = "";
  });
  return data;
}

function mergeDatabases(remoteRaw, localRaw) {
  const remote = normalizeDB(remoteRaw);
  const local = normalizeDB(localRaw);

  const userMap = new Map();
  remote.users.forEach(u => userMap.set(u.id, { ...u }));
  local.users.forEach(lu => {
    if (!userMap.has(lu.id)) {
      userMap.set(lu.id, { ...lu });
    } else {
      const ru = userMap.get(lu.id);
      if (currentUser && lu.id === currentUser.id) {
        userMap.set(lu.id, {
          ...ru,
          ...lu,
          points: lu.points,
          spentPoints: Math.max(ru.spentPoints || 0, lu.spentPoints || 0),
          weeklyPoints: Math.max(ru.weeklyPoints || 0, lu.weeklyPoints || 0),
          owned: Array.from(new Set([...(ru.owned || []), ...(lu.owned || [])])),
          solvedTests: Array.from(new Set([...(ru.solvedTests || []), ...(lu.solvedTests || [])])),
          claimedMissions: Array.from(new Set([...(ru.claimedMissions || []), ...(lu.claimedMissions || [])]))
        });
      }
    }
  });

  const roomMap = new Map();
  remote.rooms.forEach(r => roomMap.set(r.id, { ...r }));
  local.rooms.forEach(lr => {
    if (!roomMap.has(lr.id)) roomMap.set(lr.id, { ...lr });
    else {
      const rr = roomMap.get(lr.id);
      rr.members = Array.from(new Set([...(rr.members || []), ...(lr.members || [])]));
    }
  });

  const mergedMessages = { ...remote.messages };
  Object.keys(local.messages || {}).forEach(rid => {
    const rList = mergedMessages[rid] || [];
    const lList = local.messages[rid] || [];
    const msgMap = new Map();
    rList.forEach(m => msgMap.set(m.id, m));
    lList.forEach(m => { if (!msgMap.has(m.id)) msgMap.set(m.id, m); });
    mergedMessages[rid] = Array.from(msgMap.values());
  });

  const mergeById = (arr1, arr2) => {
    const m = new Map();
    arr1.forEach(x => m.set(x.id, x));
    arr2.forEach(x => { if (!m.has(x.id)) m.set(x.id, x); });
    return Array.from(m.values());
  };

  return normalizeDB({
    users: Array.from(userMap.values()),
    rooms: Array.from(roomMap.values()),
    messages: mergedMessages,
    tasks: mergeById(remote.tasks, local.tasks),
    announcements: mergeById(remote.announcements, local.announcements),
    certificates: mergeById(remote.certificates, local.certificates),
    customTests: mergeById(remote.customTests, local.customTests)
  });
}

async function pullFromCloud(silent = true) {
  if (!CLOUD_DB_URL) return false;
  try {
    const res = await fetch(CLOUD_DB_URL + "?t=" + Date.now());
    if (!res.ok) return false;
    const remote = await res.json();
    if (remote && typeof remote === "object") {
      DB = mergeDatabases(remote, DB);
      localStorage.setItem("maktabos_db_v4", JSON.stringify(DB));
    } else {
      await pushToCloud(true);
    }
    return true;
  } catch (err) {
    if (!silent) notify("Server bilan aloqa o'rnatilmadi", "error");
    return false;
  }
}

async function pushToCloud(skipPull = false) {
  localStorage.setItem("maktabos_db_v4", JSON.stringify(DB));
  if (!CLOUD_DB_URL) return false;
  try {
    if (!skipPull) {
      const resGet = await fetch(CLOUD_DB_URL + "?t=" + Date.now());
      if (resGet.ok) {
        const remote = await resGet.json();
        if (remote && typeof remote === "object") {
          DB = mergeDatabases(remote, DB);
          localStorage.setItem("maktabos_db_v4", JSON.stringify(DB));
        }
      }
    }
    const resPut = await fetch(CLOUD_DB_URL, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(DB)
    });
    return resPut.ok;
  } catch (e) {
    return false;
  }
}

(async function restoreSessionOnLoad() {
  const savedUid = localStorage.getItem(SESSION_KEY);
  if (savedUid) {
    const cachedUser = DB.users.find(u => u.id === savedUid);
    if (cachedUser && !cachedUser.banned) {
      currentUser = cachedUser;
      enterApp();
    }
  }
  const synced = await pullFromCloud(true);
  if (synced && savedUid) {
    const freshUser = DB.users.find(u => u.id === savedUid);
    if (freshUser && !freshUser.banned) {
      currentUser = freshUser;
      if (document.getElementById("appScreen").classList.contains("hidden")) {
        enterApp();
      } else {
        updateTopbar();
        if (currentView === "ranking") renderRanking(document.getElementById("mainContent"));
      }
    } else {
      localStorage.removeItem(SESSION_KEY);
      if (currentUser) logout();
    }
  }
})();

async function handleRegister(e) {
  e.preventDefault();
  const btn = document.getElementById("regSubmitBtn");
  btn.disabled = true;
  btn.textContent = "Saqlanmoqda...";

  await pullFromCloud(true);

  const name = document.getElementById("regName").value.trim();
  const role = document.getElementById("regRole").value;
  const grade = document.getElementById("regClass").value;
  const subject = document.getElementById("regSubject").value;
  const login = document.getElementById("regLogin").value.trim();
  const pass = document.getElementById("regPass").value.trim();

  if (DB.users.some(u => u.login.toLowerCase() === login.toLowerCase())) {
    notify("Bu login band! Boshqa login tanlang.", "error");
    btn.disabled = false;
    btn.textContent = "MaktabOS ga Qo'shilish";
    return;
  }

  const today = new Date().toISOString().slice(0, 10);
  const newUser = {
    id: "u_" + Date.now() + "_" + Math.floor(Math.random() * 1000),
    name, login, pass, role,
    grade: role !== "teacher" ? grade : "",
    subject: role === "teacher" ? subject : "",
    points: 0,
    spentPoints: 0,
    weeklyPoints: 0,
    streak: 1,
    lastLoginDate: today,
    avatarImg: "",
    owned: [],
    activeFrame: "",
    activeTitle: "",
    solvedTests: [],
    claimedMissions: [],
    banned: false
  };

  DB.users.push(newUser);
  if (!DB.rooms[0].members.includes(newUser.id)) {
    DB.rooms[0].members.push(newUser.id);
  }

  if (role === "homeroom") {
    const roomId = "r_class_" + grade.replace(/\W/g, "");
    if (!DB.rooms.some(r => r.id === roomId)) {
      const classStudents = DB.users.filter(u => u.grade === grade).map(u => u.id);
      DB.rooms.push({
        id: roomId,
        name: `${grade} — Sinf Rahbari Guruhi`,
        type: "group",
        desc: `${grade} o'quvchilari va sinf rahbari (${name}) rasmiy guruhi`,
        creator: name,
        members: classStudents,
        pinned: `${grade} rasmiy guruhi faoliyatini boshladi.`
      });
      DB.messages[roomId] = [];
    }
  } else if (role === "student") {
    const roomId = "r_class_" + grade.replace(/\W/g, "");
    const existingRoom = DB.rooms.find(r => r.id === roomId);
    if (existingRoom && !existingRoom.members.includes(newUser.id)) {
      existingRoom.members.push(newUser.id);
    }
  }

  currentUser = newUser;
  await pushToCloud(false);
  btn.disabled = false;
  btn.textContent = "MaktabOS ga Qo'shilish";

  localStorage.setItem(SESSION_KEY, newUser.id);
  notify(`Xush kelibsiz, ${name}!`, "success");
  enterApp();
}

        { id: "profile", label: "Profil", icon: ICONS.user }
      ]
    : [
        { id: "dashboard", label: "Asosiy", icon: ICONS.home },
        { id: "chats", label: "Chatlar", icon: ICONS.chat },
        { id: "ranking", label: "Reyting", icon: ICONS.rank },
        { id: "tests", label: "Testlar", icon: ICONS.test },
        { id: "profile", label: "Profil", icon: ICONS.user }
      ];
  bnav.innerHTML = quick.map(q => `
    <button class="bnav-btn ${currentView === q.id ? 'active' : ''}" onclick="navigate('${q.id}')">
      ${q.icon}
      <span>${q.label}</span>
      <span class="bnav-bar"></span>
    </button>
  `).join("");
}

async function navigate(viewId) {
  currentView = viewId;
  document.getElementById("sidebar").classList.remove("open");
  document.getElementById("sidebarOverlay").classList.remove("show");
  renderSidebarMenu();
  renderBottomNav();
  updateTopbar();
  const box = document.getElementById("mainContent");

  if (viewId === "ranking" || viewId === "admin" || viewId === "chats") {
    await pullFromCloud(true);
    updateTopbar();
  }

  if (viewId === "dashboard") renderDashboard(box);
  else if (viewId === "chats") renderChats(box);
  else if (viewId === "tasks") renderTasks(box);
  else if (viewId === "tests") renderTests(box);
  else if (viewId === "ai") renderAI(box);
  else if (viewId === "ranking") renderRanking(box);
  else if (viewId === "store") renderStore(box);
  else if (viewId === "student_certs") renderStudentCertsForTeacher(box);
  else if (viewId === "announcements") renderAnnouncements(box);
  else if (viewId === "profile") renderProfile(box);
  else if (viewId === "admin") renderAdmin(box);
}

function claimMission(missionId, reward) {
  if (!currentUser.claimedMissions) currentUser.claimedMissions = [];
  if (currentUser.claimedMissions.includes(missionId)) return;
  currentUser.claimedMissions.push(missionId);
  currentUser.points += reward;
  currentUser.weeklyPoints = (currentUser.weeklyPoints || 0) + reward;
  saveDB();
  updateTopbar();
  notify(`Missiya bajarildi! +${reward} ball qo'shildi.`, "success");
  renderDashboard(document.getElementById("mainContent"));
}

  }

    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:16px;">
      <div>
        <h2 class="page-title">${ICONS.chat} Chatlar va Kanallar</h2>

            <div class="chat-room-item ${r.id === activeRoomId ? 'active' : ''}" onclick="selectRoom('${r.id}')">
              <div style="font-weight:700;font-size:13.5px;color:var(--text);">${r.name}</div>
              <div style="font-size:11.5px;color:var(--muted);margin-top:2px;">

          `).join("")}

      <div class="chat-main">

          <div class="chat-header">
            <div>
              <div style="font-weight:700;font-size:14.5px;color:var(--text);">${activeRoom.name}</div>
              <div style="font-size:11.5px;color:var(--muted);">${activeRoom.desc || ''} • ${activeRoom.id === 'r_general' ? DB.users.length : activeRoom.members.length} a'zo</div>
            </div>
            <div style="display:flex;gap:6px;flex-wrap:wrap;">
              <button class="btn-secondary" style="padding:6px 11px;font-size:12px;" onclick="viewRoomMembers('${activeRoom.id}')">A'zolar</button>
              <button class="btn-secondary" style="padding:6px 11px;font-size:12px;" onclick="openPollModal()">So'rovnoma</button>
            </div>
          </div>

          ${activeRoom.pinned ? `
            <div style="background:#FFFBEB;padding:8px 16px;font-size:12px;color:#B45309;border-bottom:1px solid #FEF3C7;">
              <strong>Mahkamlangan:</strong> ${activeRoom.pinned}
            </div>
          ` : ''}

          <div id="chatMsgList" class="chat-messages">
            ${msgs.map(m => {
              const ajoyibUsers = (m.reactedBy && Array.isArray(m.reactedBy["Ajoyib"])) ? m.reactedBy["Ajoyib"] : [];
              const foydaliUsers = (m.reactedBy && Array.isArray(m.reactedBy["Foydali"])) ? m.reactedBy["Foydali"] : [];
              const hasAjoyib = ajoyibUsers.includes(currentUser.id);
              const hasFoydali = foydaliUsers.includes(currentUser.id);
              const ajoyibCount = m.reactedBy ? ajoyibUsers.length : (m.reactions?.["Ajoyib"] || 0);
              const foydaliCount = m.reactedBy ? foydaliUsers.length : (m.reactions?.["Foydali"] || 0);

              return `
              <div class="msg-bubble ${m.senderId === currentUser.id ? 'mine' : ''}">
                <div class="msg-meta">
                  <span>${m.senderName}</span>

              <input type="file" accept="video/*" class="hidden" onchange="sendMediaFile(event, 'video')" />

        ` : ''}
      </div>

  `;
  const list = document.getElementById("chatMsgList");
  if (list) list.scrollTop = list.scrollHeight;
}

function selectRoom(id) { activeRoomId = id; renderChats(document.getElementById("mainContent")); }

function sendMessage(e) {
  e.preventDefault();
  const inp = document.getElementById("chatInput");
  const txt = inp.value.trim();
  if (!txt) return;
  if (!DB.messages[activeRoomId]) DB.messages[activeRoomId] = [];
  DB.messages[activeRoomId].push({
    id: "m_" + Date.now() + "_" + Math.floor(Math.random() * 1000),
    senderId: currentUser.id,
    senderName: currentUser.name,
    text: txt,
    time: new Date().toTimeString().slice(0,5),
    reactions: { "Ajoyib": 0, "Foydali": 0 },
    reactedBy: { "Ajoyib": [], "Foydali": [] },
    replyTo: replyTarget
  });
  replyTarget = null;
  saveDB();
  renderChats(document.getElementById("mainContent"));
}

function sendMediaFile(e, type) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    if (!DB.messages[activeRoomId]) DB.messages[activeRoomId] = [];
    DB.messages[activeRoomId].push({
      id: "m_" + Date.now() + "_" + Math.floor(Math.random() * 1000),
      senderId: currentUser.id,
      senderName: currentUser.name,
      text: file.name,
      mediaType: type,
      mediaUrl: ev.target.result,
      time: new Date().toTimeString().slice(0,5),
      reactions: { "Ajoyib": 0, "Foydali": 0 },
      reactedBy: { "Ajoyib": [], "Foydali": [] },
      replyTo: null
    });
    saveDB();
    notify("Media fayl yuborildi", "success");
    renderChats(document.getElementById("mainContent"));
  };
  reader.readAsDataURL(file);
}

function reactMsg(msgId, key) {
  const msg = (DB.messages[activeRoomId] || []).find(m => m.id === msgId);
  if (!msg) return;
  if (!msg.reactions) msg.reactions = {};
  if (!msg.reactedBy) msg.reactedBy = {};
  if (!Array.isArray(msg.reactedBy[key])) msg.reactedBy[key] = [];

  const idx = msg.reactedBy[key].indexOf(currentUser.id);
  if (idx === -1) {
    msg.reactedBy[key].push(currentUser.id);
  } else {
    msg.reactedBy[key].splice(idx, 1);
  }
  msg.reactions[key] = msg.reactedBy[key].length;

  saveDB();
  renderChats(document.getElementById("mainContent"));
}

function setReply(txt) {
  replyTarget = txt;
  document.getElementById("replyBar").classList.remove("hidden");
  document.getElementById("replyText").textContent = "Javob: " + txt;
}
function clearReply() {
  replyTarget = null;
  document.getElementById("replyBar").classList.add("hidden");
}
function pinMsg(txt) {
  const room = DB.rooms.find(r => r.id === activeRoomId);
  if (room) {
    room.pinned = txt;
    saveDB();
    notify("Xabar yuqoriga mahkamlandi", "success");
    renderChats(document.getElementById("mainContent"));
  }
}
function deleteMsg(msgId) {
  DB.messages[activeRoomId] = (DB.messages[activeRoomId] || []).filter(m => m.id !== msgId);
  saveDB();
  notify("Xabar o'chirildi");
  renderChats(document.getElementById("mainContent"));
}

    id, name,
    type: document.getElementById("newRoomType").value,

function startDirectChat(targetId) {
  const target = DB.users.find(u => u.id === targetId);
  if (!target) return;
  const pairId = "dm_" + [currentUser.id, targetId].sort().join("_");
  if (!DB.rooms.some(r => r.id === pairId)) {
    DB.rooms.push({
      id: pairId,
      name: `${currentUser.name} & ${target.name}`,
      type: "direct",
      desc: "Shaxsiy suhbat",
      creator: currentUser.name,
      members: [currentUser.id, targetId],
      pinned: ""
    });
    DB.messages[pairId] = [];

  activeRoomId = pairId;
  saveDB();
  closeModal();
  renderChats(document.getElementById("mainContent"));

function createTask() {
  const title = document.getElementById("taskTitle").value.trim();
  const desc = document.getElementById("taskDesc").value.trim();
  let maxPoints = parseInt(document.getElementById("taskMax").value, 10) || 60;
  if (maxPoints > 60) maxPoints = 60;
  if (!title) return;

  DB.tasks.unshift({
    id: "t_" + Date.now(),
    subject: document.getElementById("taskSubj").value,
    title, desc, maxPoints,
    deadline: document.getElementById("taskDate").value,
    teacherId: currentUser.id,
    teacherName: currentUser.name,
    submissions: []
  });
  saveDB();
  closeModal();
  notify("Yangi vazifa e'lon qilindi!", "success");
  renderTasks(document.getElementById("mainContent"));
}

function submitTask(taskId) {
  const ans = document.getElementById("ans_" + taskId).value.trim();
  if (!ans) return;
  const task = DB.tasks.find(t => t.id === taskId);
  task.submissions.push({ studentId: currentUser.id, studentName: currentUser.name, answer: ans, grade: null });
  saveDB();
  notify("Javobingiz ustozga yuborildi!", "success");
  renderTasks(document.getElementById("mainContent"));
}

function gradeTask(taskId, studentId) {
  const task = DB.tasks.find(t => t.id === taskId);
  const sub = task.submissions.find(s => s.studentId === studentId);
  let val = parseInt(document.getElementById(`grd_${taskId}_${studentId}`).value, 10);
  if (isNaN(val) || val < 0) val = 0;
  if (val > task.maxPoints) val = task.maxPoints;

  sub.grade = val;
  const st = DB.users.find(u => u.id === studentId);
  if (st) {
    st.points += val;
    st.weeklyPoints = (st.weeklyPoints || 0) + val;
  }
  saveDB();
  notify(`O'quvchiga +${val} ball berildi!`, "success");
  renderTasks(document.getElementById("mainContent"));
}

function finishTest(testId) {
  const test = getAllTests().find(t => t.id === testId);
  let correctCount = 0;
  test.questions.forEach((qObj, idx) => {
    const sel = document.querySelector(`input[name="q_${idx}"]:checked`);
    if (sel && parseInt(sel.value, 10) === qObj.correct) correctCount++;
  });
  const earned = correctCount * 10;
  if (!currentUser.solvedTests) currentUser.solvedTests = [];
  currentUser.solvedTests.push(test.id);
  currentUser.points += earned;
  currentUser.weeklyPoints = (currentUser.weeklyPoints || 0) + earned;
  saveDB();
  updateTopbar();
  closeModal();
  notify(`Test yakunlandi! To'g'ri: ${correctCount}/${test.questions.length}. +${earned} ball qo'shildi!`, "success");
  navigate("tests");
}

function askAI(e) {
  e.preventDefault();
  const inp = document.getElementById("aiPrompt");
  const q = inp.value.trim();
  if (!q) return;
  const hist = document.getElementById("aiHistory");
  hist.innerHTML += `<div class="msg-bubble mine"><div class="msg-meta"><span>Siz</span></div><div>${q}</div></div>`;

  let answer = "";
  const mathMatch = q.match(/^[0-9+\-*/().\s]+$/);
  if (mathMatch) {
    try {
      const res = Function('"use strict";return (' + q + ')')();
      answer = `Natija: <strong>${q} = ${res}</strong>.`;
    } catch { answer = "Ifodani tekshirib qayta yozing."; }
  } else if (q.toLowerCase().includes("kvadrat")) {
    answer = "<strong>Kvadrat tenglama:</strong> ax² + bx + c = 0. Diskriminant D = b² - 4ac. Agar D > 0 bo'lsa, x₁,₂ = (-b ± √D) / (2a).";
  } else if (q.toLowerCase().includes("pifagor")) {
    answer = "<strong>Pifagor teoremasi:</strong> To'g'ri burchakli uchburchakda gipotenuzaning kvadrati katetlar kvadratlari yig'indisiga teng: c² = a² + b².";
  } else {
    answer = `<strong>"${q}"</strong> bo'yicha tahlil: Mavzuning asosiy qoidalarini ko'rib chiqing, so'ngra Fan Testlari bo'limida savollarni yechib ball to'plang.`;
  }

  hist.innerHTML += `<div class="msg-bubble"><div class="msg-meta"><span>MaktabOS AI</span></div><div>${answer}</div></div>`;
  inp.value = "";
  hist.scrollTop = hist.scrollHeight;
}

function buyItem(itemId) {
  const item = STORE_CATALOG.find(i => i.id === itemId);
  if (!item) return;
  if (currentUser.points < item.price) {
    notify(`Ballaringiz yetarli emas! ${item.price} ball kerak (Sizda: ${currentUser.points} ball).`, "error");
    return;
  }
  currentUser.points -= item.price;
  currentUser.spentPoints = (currentUser.spentPoints || 0) + item.price;
  if (!currentUser.owned) currentUser.owned = [];
  currentUser.owned.push(item.id);

  if (item.type === "frame") currentUser.activeFrame = item.gifKey;
  if (item.type === "title") currentUser.activeTitle = item.name;
  if (item.type === "certificate") {
    const certRecord = {
      id: "MOS-" + Math.floor(100000 + Math.random() * 900000),
      studentId: currentUser.id,
      studentName: currentUser.name,
      grade: currentUser.grade,
      title: item.name,
      tier: item.tier,
      date: new Date().toISOString().slice(0, 10),
      delivered: false
    };
    DB.certificates.unshift(certRecord);
    DB.messages["r_general"].push({
      id: "m_" + Date.now(),
      senderId: "u_admin",
      senderName: "MaktabOS Tizimi",
      text: `YANGI SERTIFIKAT! ${currentUser.grade} o'quvchisi ${currentUser.name} 1200 ball evaziga "${item.name}" rasmiy sertifikatini qo'lga kiritdi (ID: ${certRecord.id}).`,
      time: new Date().toTimeString().slice(0,5),
      reactions: { "Ajoyib": 1, "Foydali": 0 },
      reactedBy: { "Ajoyib": ["u_admin"], "Foydali": [] }
    });
  }

  saveDB();
  updateTopbar();
  notify(`"${item.name}" olindi!`, "success");
  renderStore(document.getElementById("mainContent"));
}

function openAnnModal(editId = null) {
  const item = editId ? DB.announcements.find(a => a.id === editId) : null;
  openModal(`
    <h3 style="margin-bottom:12px;color:var(--text);">${item ? "E'lonni Tahrirlash" : "Yangi E'lon"}</h3>
    <div class="form-group"><label>Sarlavha</label><input id="annTitle" value="${item ? item.title : ''}" /></div>

      <button class="btn-secondary" onclick="closeModal()">Bekor qilish</button>
      <button class="btn-primary" style="width:auto;margin:0;" onclick="saveAnn('${editId || ''}')">Saqlash</button>
    </div>
  `);
}

function saveAnn(editId) {
  const title = document.getElementById("annTitle").value.trim();
  const body = document.getElementById("annBody").value.trim();
  if (!title || !body) return;
  if (editId) {
    const item = DB.announcements.find(a => a.id === editId);
    item.title = title; item.body = body;
  } else {
    DB.announcements.unshift({
      id: "ann_" + Date.now(), title, body,
      author: currentUser.name, date: new Date().toISOString().slice(0,10),
      views: [currentUser.id]
    });
  }
  saveDB();
  closeModal();
  notify("E'lon saqlandi!", "success");
  renderAnnouncements(document.getElementById("mainContent"));
}

function deleteAnn(id) {
  DB.announcements = DB.announcements.filter(a => a.id !== id);
  saveDB();
  notify("E'lon o'chirildi");
  renderAnnouncements(document.getElementById("mainContent"));
}

  const studentsCount = DB.users.filter(u => u.role === "student").length;
  const teachersCount = DB.users.filter(u => u.role === "teacher" || u.role === "homeroom").length;
  const bannedCount = DB.users.filter(u => u.banned).length;

  const filteredUsers = DB.users.filter(u => {
    const matchesSearch = u.name.toLowerCase().includes(adminSearch.toLowerCase()) ||
                          u.login.toLowerCase().includes(adminSearch.toLowerCase());
    const matchesRole = adminRoleFilter === "all" || u.role === adminRoleFilter;
    return matchesSearch && matchesRole;
  });

  box.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:18px;">
      <div>
        <h2 class="page-title">${ICONS.admin} Super Admin Boshqaruv Paneli</h2>
        <p class="page-sub" style="margin:0;">Barcha foydalanuvchilar, ballar va tizim boshqaruvi</p>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn-secondary" onclick="manualCloudPull()">Yangilash</button>
        <button class="btn-gold" onclick="openAdminCreateUserModal()">+ Yangi Foydalanuvchi</button>
        <button class="btn-primary" style="width:auto;margin:0;" onclick="openAdminBroadcastModal()">Ommaviy E'lon</button>
      </div>
    </div>

    <div class="grid-3">
      <div class="card">
        <div class="stat-label">Jami Foydalanuvchilar</div>
        <div class="stat-val">${DB.users.length} nafar</div>
        <div style="font-size:12px;color:var(--muted);margin-top:4px;">${studentsCount} o'quvchi • ${teachersCount} ustoz • ${bannedCount} bloklangan</div>
      </div>
      <div class="card">
        <div class="stat-label">Tizim Faolligi</div>
        <div class="stat-val">${DB.rooms.length} kanal / ${DB.tasks.length} vazifa</div>
        <div style="font-size:12px;color:var(--muted);margin-top:4px;">Testlar bazasi: ${getAllTests().length} ta</div>
      </div>
      <div class="card">
        <div class="stat-label">Tezkor Amallar</div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;">
          <button class="btn-secondary" style="font-size:12px;padding:7px 10px;" onclick="confirmResetWeekly()">Haftalikni 0 qilish</button>
          <button class="btn-secondary" style="font-size:12px;padding:7px 10px;" onclick="exportDatabaseBackup()">Zaxira (JSON)</button>
        </div>
      </div>
    </div>

    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;">
      <button class="${adminTab === 'users' ? 'btn-primary' : 'btn-secondary'}" style="width:auto;margin:0;" onclick="adminTab='users';renderAdmin(document.getElementById('mainContent'))">Foydalanuvchilar (${DB.users.length})</button>
      <button class="${adminTab === 'rooms' ? 'btn-primary' : 'btn-secondary'}" style="width:auto;margin:0;" onclick="adminTab='rooms';renderAdmin(document.getElementById('mainContent'))">Guruh va Kanallar (${DB.rooms.length})</button>
      <button class="${adminTab === 'certs' ? 'btn-primary' : 'btn-secondary'}" style="width:auto;margin:0;" onclick="adminTab='certs';renderAdmin(document.getElementById('mainContent'))">Sertifikatlar (${DB.certificates.length})</button>
      <button class="${adminTab === 'tasks' ? 'btn-primary' : 'btn-secondary'}" style="width:auto;margin:0;" onclick="adminTab='tasks';renderAdmin(document.getElementById('mainContent'))">Vazifalar (${DB.tasks.length})</button>
    </div>

    ${adminTab === 'users' ? `
      <div class="card" style="margin-bottom:14px;display:flex;gap:10px;flex-wrap:wrap;">
        <input type="text" placeholder="Ism yoki login bo'yicha qidirish..." value="${adminSearch}" oninput="adminSearch=this.value;renderAdmin(document.getElementById('mainContent'))" style="flex:2;min-width:200px;" />
        <select onchange="adminRoleFilter=this.value;renderAdmin(document.getElementById('mainContent'))" style="flex:1;min-width:150px;">
          <option value="all" ${adminRoleFilter === 'all' ? 'selected' : ''}>Barcha rollar</option>
          <option value="student" ${adminRoleFilter === 'student' ? 'selected' : ''}>O'quvchilar</option>
          <option value="teacher" ${adminRoleFilter === 'teacher' ? 'selected' : ''}>Fan o'qituvchilari</option>
          <option value="homeroom" ${adminRoleFilter === 'homeroom' ? 'selected' : ''}>Sinf rahbarlari</option>
        </select>
      </div>

      <div class="card" style="overflow-x:auto;">
        <table style="width:100%;border-collapse:collapse;font-size:13px;text-align:left;min-width:760px;">
          <thead>
            <tr style="border-bottom:1.5px solid var(--border);color:var(--muted);font-size:12px;">
              <th style="padding:10px;">Foydalanuvchi</th>
              <th style="padding:10px;">Rol / Sinf</th>
              <th style="padding:10px;">Login / Parol</th>
              <th style="padding:10px;">Balans / Jami</th>
              <th style="padding:10px;">Holat</th>
              <th style="padding:10px;">Boshqaruv</th>
            </tr>
          </thead>
          <tbody>
            ${filteredUsers.map(u => `
              <tr style="border-bottom:1px solid var(--border-soft);${u.banned ? 'background:#FFF1F2;' : ''}">
                <td style="padding:10px;display:flex;align-items:center;gap:8px;">
                  ${renderAvatarHTML(u, 32, 12)}
                  <div>
                    <strong>${u.name}</strong>
                    ${u.activeTitle ? `<div style="font-size:10px;color:var(--gold);font-weight:700;">${u.activeTitle}</div>` : ''}
                  </div>
                </td>
                <td style="padding:10px;">${u.role} ${u.grade || u.subject || ''}</td>
                <td style="padding:10px;"><code>${u.login}</code> / <code>${u.pass}</code></td>
                <td style="padding:10px;"><strong>${u.points}</strong> / ${getTotalEarnedPoints(u)}</td>
                <td style="padding:10px;">
                  ${u.banned ? `<span class="badge badge-red">Bloklangan</span>` : `<span class="badge badge-green">Faol</span>`}
                </td>
                <td style="padding:10px;display:flex;gap:5px;flex-wrap:wrap;">
                  <button class="btn-secondary" style="padding:6px 9px;" onclick="openAdminEditUserModal('${u.id}')">Tahrirlash</button>
                  ${u.role === 'student' ? `
                    <button class="btn-secondary" style="padding:6px 9px;" onclick="openAdminPointsModal('${u.id}')">Ball</button>
                    <button class="btn-gold" style="padding:6px 9px;" onclick="openAdminGrantCertModal('${u.id}')">+Sertifikat</button>
                  ` : ''}
                  ${u.id !== 'u_admin' ? `
                    <button class="btn-secondary" style="padding:6px 9px;" onclick="toggleUserBan('${u.id}')">${u.banned ? 'Ochish' : 'Bloklash'}</button>
                    <button class="btn-accent" style="padding:6px 9px;" onclick="confirmDeleteUser('${u.id}', '${u.name}')">O'chirish</button>
                  ` : ''}
                </td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      </div>
    ` : ''}

    ${adminTab === 'rooms' ? `
      <div class="card">
        <h3 style="color:var(--text);font-size:16px;margin-bottom:12px;">Barcha Guruh va Kanallar</h3>
        ${DB.rooms.map(r => `
          <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border-soft);flex-wrap:wrap;gap:8px;">
            <div>
              <strong>${r.name}</strong> <span class="badge">${r.type}</span>
              <div style="font-size:12px;color:var(--muted);">Yaratuvchi: ${r.creator} • A'zolar: ${r.id === 'r_general' ? DB.users.length : r.members.length} nafar</div>
            </div>
            ${r.id !== 'r_general' ? `<button class="btn-accent" onclick="adminDeleteRoom('${r.id}')">O'chirish</button>` : `<span class="badge badge-green">Asosiy kanal</span>`}
          </div>
        `).join("")}
      </div>
    ` : ''}

    ${adminTab === 'certs' ? `
      <div class="card">
        <h3 style="color:var(--text);font-size:16px;margin-bottom:12px;">Barcha Sertifikatlar</h3>
        ${DB.certificates.length === 0 ? `<p style="color:var(--muted);font-size:13.5px;">Hozircha sertifikatlar yo'q.</p>` : DB.certificates.map(c => `
          <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border-soft);flex-wrap:wrap;gap:8px;">
            <div>
              <strong>${c.studentName}</strong> (${c.grade}) — <strong>${c.title}</strong>
              <div style="font-size:12px;color:var(--muted);">ID: ${c.id} • Sana: ${c.date}</div>
            </div>
            <div style="display:flex;gap:6px;">
              <button class="btn-secondary" onclick="openCertPdfModal('${c.id}')">Ko'rish</button>
              <button class="btn-accent" onclick="adminDeleteCert('${c.id}')">Bekor qilish</button>
            </div>
          </div>
        `).join("")}
      </div>
    ` : ''}

    ${adminTab === 'tasks' ? `
      <div class="card">
        <h3 style="color:var(--text);font-size:16px;margin-bottom:12px;">Barcha Berilgan Vazifalar</h3>
        ${DB.tasks.length === 0 ? `<p style="color:var(--muted);font-size:13.5px;">Hozircha vazifalar yo'q.</p>` : DB.tasks.map(t => `
          <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border-soft);flex-wrap:wrap;gap:8px;">
            <div>
              <strong>${t.title}</strong> <span class="badge">${t.subject}</span>
              <div style="font-size:12px;color:var(--muted);">Ustoz: ${t.teacherName} • Topshirdi: ${t.submissions.length} o'quvchi</div>
            </div>
            <button class="btn-accent" onclick="adminDeleteTask('${t.id}')">O'chirish</button>
          </div>
        `).join("")}
      </div>
    ` : ''}
  `;
}

function openAdminCreateUserModal() {
  openModal(`
    <h3 style="color:var(--text);margin-bottom:12px;">Yangi Foydalanuvchi Qo'shish</h3>
    <div class="form-group"><label>Ism va Familiya</label><input id="admNewName" placeholder="To'liq ism" /></div>
    <div class="form-group"><label>Maqomi</label>
      <select id="admNewRole">
        <option value="student">O'quvchi</option>
        <option value="teacher">Fan O'qituvchisi</option>
        <option value="homeroom">Sinf Rahbari</option>
      </select>
    </div>
    <div class="form-group"><label>Sinf (O'quvchi / Sinf rahbari uchun)</label>
      <select id="admNewGrade">${CLASSES.map(c => `<option value="${c}">${c}</option>`).join("")}</select>
    </div>
    <div class="form-group"><label>Fan (O'qituvchi uchun)</label>
      <select id="admNewSubj">${SUBJECTS.map(s => `<option value="${s}">${s}</option>`).join("")}</select>
    </div>
    <div class="form-group"><label>Login</label><input id="admNewLogin" placeholder="Login" /></div>
    <div class="form-group"><label>Parol</label><input id="admNewPass" placeholder="Parol" /></div>
    <div style="display:flex;gap:8px;justify-content:flex-end;">
      <button class="btn-secondary" onclick="closeModal()">Bekor qilish</button>
      <button class="btn-primary" style="width:auto;margin:0;" onclick="adminCreateUser()">Yaratish</button>
    </div>
  `);
}

function adminCreateUser() {
  const name = document.getElementById("admNewName").value.trim();
  const role = document.getElementById("admNewRole").value;
  const grade = document.getElementById("admNewGrade").value;
  const subject = document.getElementById("admNewSubj").value;
  const login = document.getElementById("admNewLogin").value.trim();
  const pass = document.getElementById("admNewPass").value.trim();
  if (!name || !login || !pass) return;
  if (DB.users.some(u => u.login.toLowerCase() === login.toLowerCase())) {
    notify("Bu login tizimda mavjud!", "error");
    return;
  }
  const newU = {
    id: "u_" + Date.now() + "_" + Math.floor(Math.random() * 1000), name, login, pass, role,
    grade: role !== "teacher" ? grade : "",
    subject: role === "teacher" ? subject : "",
    points: 0, spentPoints: 0, weeklyPoints: 0, streak: 1, lastLoginDate: "",
    avatarImg: "", owned: [], activeFrame: "", activeTitle: "", solvedTests: [], claimedMissions: [], banned: false
  };
  DB.users.push(newU);
  if (!DB.rooms[0].members.includes(newU.id)) DB.rooms[0].members.push(newU.id);
  saveDB();
  closeModal();
  notify(`${name} muvaffaqiyatli qo'shildi!`, "success");
  renderAdmin(document.getElementById("mainContent"));
}

function openAdminEditUserModal(uid) {
  const u = DB.users.find(x => x.id === uid);
  if (!u) return;
  openModal(`
    <h3 style="color:var(--text);margin-bottom:12px;">Foydalanuvchini Tahrirlash</h3>
    <div class="form-group"><label>Ism Familiya</label><input id="admEdName" value="${u.name}" /></div>
    <div class="form-group"><label>Login</label><input id="admEdLogin" value="${u.login}" /></div>
    <div class="form-group"><label>Parol</label><input id="admEdPass" value="${u.pass}" /></div>
    ${u.role !== 'admin' ? `
      <div class="form-group"><label>Sinf</label>
        <select id="admEdGrade">${CLASSES.map(c => `<option value="${c}" ${c === u.grade ? 'selected' : ''}>${c}</option>`).join("")}</select>
      </div>
      <div class="form-group"><label>Fan</label>
        <select id="admEdSubj">${SUBJECTS.map(s => `<option value="${s}" ${s === u.subject ? 'selected' : ''}>${s}</option>`).join("")}</select>
      </div>
    ` : ''}
    <div style="display:flex;gap:8px;justify-content:flex-end;">
      <button class="btn-secondary" onclick="closeModal()">Bekor qilish</button>
      <button class="btn-primary" style="width:auto;margin:0;" onclick="adminSaveUserEdit('${u.id}')">Saqlash</button>
    </div>
  `);
}

function adminSaveUserEdit(uid) {
  const u = DB.users.find(x => x.id === uid);
  if (!u) return;
  u.name = document.getElementById("admEdName").value.trim() || u.name;
  u.login = document.getElementById("admEdLogin").value.trim() || u.login;
  u.pass = document.getElementById("admEdPass").value.trim() || u.pass;
  if (u.role !== 'admin') {
    if (u.role !== 'teacher') u.grade = document.getElementById("admEdGrade").value;
    if (u.role === 'teacher') u.subject = document.getElementById("admEdSubj").value;
  }
  saveDB();
  closeModal();
  notify("Foydalanuvchi ma'lumotlari yangilandi!", "success");
  renderAdmin(document.getElementById("mainContent"));
}

function openAdminPointsModal(uid) {
  const u = DB.users.find(x => x.id === uid);
  if (!u) return;
  openModal(`
    <h3 style="color:var(--text);margin-bottom:8px;">Ballarni Boshqarish: ${u.name}</h3>
    <p style="font-size:13px;color:var(--muted);margin-bottom:12px;">Hozirgi balans: <strong>${u.points} ball</strong></p>
    <div class="form-group"><label>Qo'shish (+) yoki ayirish (-) miqdori</label><input type="number" id="admPtsDelta" value="200" /></div>
    <div style="display:flex;gap:8px;justify-content:flex-end;">
      <button class="btn-secondary" onclick="closeModal()">Bekor qilish</button>
      <button class="btn-primary" style="width:auto;margin:0;" onclick="applyAdminPoints('${u.id}')">Qo'llash</button>
    </div>
  `);
}

function applyAdminPoints(uid) {
  const delta = parseInt(document.getElementById("admPtsDelta").value, 10) || 0;
  const u = DB.users.find(x => x.id === uid);
  if (u) {
    u.points = Math.max(0, u.points + delta);
    u.weeklyPoints = Math.max(0, (u.weeklyPoints || 0) + delta);
    saveDB();
    closeModal();
    notify(`${u.name}: ${delta >= 0 ? '+' + delta : delta} ball o'zgartirildi`, "success");
    renderAdmin(document.getElementById("mainContent"));
  }
}

function openAdminGrantCertModal(uid) {
  const u = DB.users.find(x => x.id === uid);
  const certs = STORE_CATALOG.filter(i => i.type === "certificate");
  openModal(`
    <h3 style="color:var(--text);margin-bottom:8px;">Sertifikat Taqdim Etish</h3>
    <p style="font-size:13px;color:var(--muted);margin-bottom:12px;">O'quvchi: <strong>${u.name}</strong> (${u.grade})</p>
    <div class="form-group"><label>Sertifikat turini tanlang</label>
      <select id="admCertSelect">
        ${certs.map(c => `<option value="${c.id}">${c.name}</option>`).join("")}
      </select>
    </div>
    <div style="display:flex;gap:8px;justify-content:flex-end;">
      <button class="btn-secondary" onclick="closeModal()">Bekor qilish</button>
      <button class="btn-gold" onclick="adminGrantCert('${u.id}')">Sertifikatni Berish</button>
    </div>
  `);
}

function adminGrantCert(uid) {
  const u = DB.users.find(x => x.id === uid);
  const certId = document.getElementById("admCertSelect").value;
  const item = STORE_CATALOG.find(i => i.id === certId);
  if (!u || !item) return;

  if (!u.owned) u.owned = [];
  if (!u.owned.includes(item.id)) u.owned.push(item.id);

  const certRecord = {
    id: "MOS-" + Math.floor(100000 + Math.random() * 900000),
    studentId: u.id,
    studentName: u.name,
    grade: u.grade,
    title: item.name,
    tier: item.tier,
    date: new Date().toISOString().slice(0, 10),
    delivered: true
  };
  DB.certificates.unshift(certRecord);
  saveDB();
  closeModal();
  notify(`${u.name} ga "${item.name}" taqdim etildi!`, "success");
  renderAdmin(document.getElementById("mainContent"));
}

function toggleUserBan(uid) {
  const u = DB.users.find(x => x.id === uid);
  if (!u) return;
  u.banned = !u.banned;
  saveDB();
  notify(u.banned ? `${u.name} bloklandi` : `${u.name} blokdan chiqarildi`, u.banned ? "error" : "success");
  renderAdmin(document.getElementById("mainContent"));
}

function openAdminBroadcastModal() {
  openModal(`
    <h3 style="color:var(--text);margin-bottom:8px;">Barcha Kanallarga Ommaviy Xabar</h3>
    <p style="font-size:12px;color:var(--muted);margin-bottom:12px;">Ushbu xabar tizimdagi barcha guruh va kanallarga bir vaqtda yuboriladi</p>
    <div class="form-group"><label>Xabar matni</label><textarea id="admBroadMsg" rows="3" placeholder="Muhim xabar matnini yozing..."></textarea></div>
    <div style="display:flex;gap:8px;justify-content:flex-end;">
      <button class="btn-secondary" onclick="closeModal()">Bekor qilish</button>
      <button class="btn-primary" style="width:auto;margin:0;" onclick="sendAdminBroadcast()">Barchaga Yuborish</button>
    </div>
  `);
}

function sendAdminBroadcast() {
  const txt = document.getElementById("admBroadMsg").value.trim();
  if (!txt) return;
  DB.rooms.forEach(r => {
    if (!DB.messages[r.id]) DB.messages[r.id] = [];
    DB.messages[r.id].push({
      id: "m_" + Date.now() + Math.random(),
      senderId: currentUser.id,
      senderName: "Bosh Administrator (Rasmiy)",
      text: txt,
      time: new Date().toTimeString().slice(0,5),
      reactions: { "Ajoyib": 0, "Foydali": 0 },
      reactedBy: { "Ajoyib": [], "Foydali": [] }
    });
  });
  saveDB();
  closeModal();
  notify("Xabar barcha guruh va kanallarga yuborildi!", "success");
}

function adminDeleteRoom(rid) {
  DB.rooms = DB.rooms.filter(r => r.id !== rid);
  delete DB.messages[rid];
  saveDB();
  notify("Guruh o'chirildi");
  renderAdmin(document.getElementById("mainContent"));
}

function adminDeleteCert(cid) {
  DB.certificates = DB.certificates.filter(c => c.id !== cid);
  saveDB();
  notify("Sertifikat bekor qilindi");
  renderAdmin(document.getElementById("mainContent"));
}

function adminDeleteTask(tid) {
  DB.tasks = DB.tasks.filter(t => t.id !== tid);
  saveDB();
  notify("Vazifa o'chirildi");
  renderAdmin(document.getElementById("mainContent"));
}

function exportDatabaseBackup() {
  const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(DB, null, 2));
  const dl = document.createElement("a");
  dl.setAttribute("href", dataStr);
  dl.setAttribute("download", `MaktabOS_Backup_${new Date().toISOString().slice(0,10)}.json`);
  document.body.appendChild(dl);
  dl.click();
  dl.remove();
  notify("Tizim zaxira fayli yuklab olindi!", "success");
}

function confirmResetWeekly() {
  openModal(`
    <h3 style="color:var(--text);margin-bottom:8px;">Haftalik Reytingni Yangilash</h3>
    <p style="font-size:14px;color:var(--muted);margin-bottom:16px;">Barcha o'quvchilarning haftalik ballarini 0 ga tushirmoqchimisiz? Umumiy ballar saqlanib qoladi.</p>
    <div style="display:flex;gap:8px;justify-content:flex-end;">
      <button class="btn-secondary" onclick="closeModal()">Bekor qilish</button>
      <button class="btn-primary" style="width:auto;margin:0;" onclick="executeResetWeekly()">Tasdiqlash</button>
    </div>
  `);
}

function executeResetWeekly() {
  DB.users.forEach(u => { u.weeklyPoints = 0; });
  pushToCloud(true);
  closeModal();
  notify("Haftalik reyting 0 dan boshlandi!", "success");
  renderAdmin(document.getElementById("mainContent"));
}

function confirmDeleteUser(uid, uname) {
  openModal(`
    <h3 style="color:var(--accent);margin-bottom:8px;">Foydalanuvchini O'chirish</h3>
    <p style="font-size:14px;color:var(--muted);margin-bottom:16px;"><strong>${uname}</strong> hisobini tizimdan butunlay o'chirmoqchimisiz?</p>
    <div style="display:flex;gap:8px;justify-content:flex-end;">
      <button class="btn-secondary" onclick="closeModal()">Bekor qilish</button>
      <button class="btn-accent" onclick="executeDeleteUser('${uid}')">O'chirish</button>
    </div>
  `);
}

function executeDeleteUser(uid) {
  DB.users = DB.users.filter(u => u.id !== uid);
  pushToCloud(true);
  closeModal();
  notify("Foydalanuvchi tizimdan o'chirildi");
  renderAdmin(document.getElementById("mainContent"));
}

/* Modal Helpers */
function openModal(html) {
  document.getElementById("modalCard").innerHTML = html;
  document.getElementById("modalBackdrop").classList.remove("hidden");
}
function closeModal() { document.getElementById("modalBackdrop").classList.add("hidden"); }
function closeModalOnBg(e) { if (e.target.id === "modalBackdrop") closeModal(); }
</script>
